<style>
  :root{
    --navy:#0e3f61;--blue:#1b6ca8;--teal:#41b6c6;--gold:#c6a86a;
    --ink:#15303f;--sub:#5f7686;--line:#e7eef3;--card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
       radial-gradient(1200px 600px at 50% -10%, #1b6ca8 0%, #0e3f61 48%, #0a2e47 100%);
       font-family:'Heebo',system-ui,sans-serif;color:var(--ink);
       display:flex;align-items:flex-start;justify-content:center;padding:26px 16px 40px}
  .card{width:100%;max-width:400px;background:var(--card);border-radius:26px;overflow:hidden;
        box-shadow:0 30px 70px rgba(5,25,40,.45);position:relative}
  /* top band */
  .top{background:linear-gradient(135deg,var(--navy),var(--blue) 65%,var(--teal));
       padding:30px 24px 30px;text-align:center;position:relative;color:#fff}
  .logo{width:112px;height:112px;border-radius:50%;background:#fff;
        border:3px solid rgba(255,255,255,.8);margin:0 auto 4px;display:flex;align-items:center;justify-content:center;
        overflow:hidden;box-shadow:0 12px 30px rgba(5,25,40,.3)}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .brand{margin-top:14px;font-size:12px;font-weight:600;letter-spacing:.34em;opacity:.9;direction:ltr}
  /* avatar overlap */
  .body{padding:20px 24px 26px;text-align:center}
  .name{font-size:27px;font-weight:800;color:var(--ink);margin:0}
  .title{font-size:15px;color:var(--blue);font-weight:600;margin-top:4px}
  .sub{font-size:13px;color:var(--sub);margin-top:2px}
  .rule{height:1px;background:var(--line);margin:20px 0}
  /* actions */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
       font-size:14.5px;font-weight:700;padding:13px 10px;border-radius:14px;border:1.5px solid var(--line);
       color:var(--ink);background:#fafcfe;transition:.15s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:19px;height:19px;flex:0 0 auto}
  .btn.call{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.wa{background:#25D366;border-color:#25D366;color:#fff}
  .btn.full{grid-column:1 / -1;background:var(--navy);border-color:var(--navy);color:#fff;font-size:15.5px;padding:15px}
  /* address */
  .addr{display:flex;align-items:center;gap:9px;justify-content:center;margin-top:16px;color:var(--sub);font-size:14px}
  .addr svg{width:18px;height:18px;color:var(--blue);flex:0 0 auto}
  /* qr */
  .qr{margin-top:22px;background:#f7fafc;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
  .qr .lbl{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:12px}
  #qr{display:inline-flex;padding:10px;background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(14,63,97,.1)}
  #qr img,#qr canvas{display:block}
  .save{margin-top:14px}
  .save .btn{width:100%;border-color:var(--gold);color:#8a6d2f;background:#fbf6ea}
  .foot{text-align:center;font-size:11.5px;color:var(--sub);margin-top:18px;letter-spacing:.02em}
</style>
</head>
